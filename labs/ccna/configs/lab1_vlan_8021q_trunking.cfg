! Lab 1: VLANs, 802.1Q Trunking, and LACP EtherChannel
! Cisco Packet Tracer / Physical Switch Configuration
! Matches CCNA Chapter 2 & Part I Master Lab

hostname SW1
!
vlan 10
 name ENGINEERING
vlan 20
 name SALES
vlan 99
 name MANAGEMENT
!
! Access Port Configuration
interface range FastEthernet0/1 - 10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface range FastEthernet0/11 - 20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
! 802.1Q Trunking and LACP EtherChannel Bundle to SW2
interface Port-channel1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
 switchport trunk native vlan 99
!
interface range GigabitEthernet0/1 - 2
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
 switchport trunk native vlan 99
 channel-group 1 mode active
 no shutdown
!
interface Vlan99
 ip address 192.168.99.11 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
end
