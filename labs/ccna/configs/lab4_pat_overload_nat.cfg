! Lab 4: Port Address Translation (PAT / NAT Overload)
! Cisco Packet Tracer / Physical Router Configuration
! Matches CCNA Chapter 4 (IP Services)

hostname R1-EDGE-NAT
!
interface GigabitEthernet0/0/0
 description Inside Private LAN Interface
 ip address 192.168.1.1 255.255.255.0
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/0/1
 description Outside Public WAN Interface
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
!
! Standard Access-List Matching Private RFC 1918 LAN Traffic
ip access-list standard LAN_CLIENTS
 permit 192.168.1.0 0.0.0.255
!
! Dynamic PAT Overload Rule
ip nat inside source list LAN_CLIENTS interface GigabitEthernet0/0/1 overload
!
! Default Route to ISP Gateway
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
end
