! Lab 2: Router-on-a-Stick Inter-VLAN Routing and DHCP Relay
! Cisco Packet Tracer / Physical Router Configuration
! Matches CCNA Chapter 2 & Part I Master Lab

hostname R1-ROAS
!
interface GigabitEthernet0/0/0
 no ip address
 no shutdown
!
interface GigabitEthernet0/0/0.10
 description Gateway for VLAN 10 (Engineering)
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip helper-address 192.168.99.100
!
interface GigabitEthernet0/0/0.20
 description Gateway for VLAN 20 (Sales)
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip helper-address 192.168.99.100
!
interface GigabitEthernet0/0/0.99
 description Gateway for VLAN 99 (Management Native)
 encapsulation dot1Q 99 native
 ip address 192.168.99.1 255.255.255.0
!
! Local DHCP Pools for Testing
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.20.1 192.168.20.10
!
ip dhcp pool POOL_VLAN10
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 8.8.8.8
!
ip dhcp pool POOL_VLAN20
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 8.8.8.8
!
end
