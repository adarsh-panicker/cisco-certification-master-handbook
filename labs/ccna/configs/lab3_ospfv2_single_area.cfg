! Lab 3: Single-Area OSPFv2 Convergence and Verification
! Cisco Packet Tracer / Physical Router Configuration
! Matches CCNA Chapter 3 (IP Connectivity)

hostname R1-BRANCH
!
interface Loopback0
 description Router ID Loopback
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0/0
 description Point-to-Point WAN Link to HQ
 ip address 10.0.12.1 255.255.255.252
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 no shutdown
!
interface GigabitEthernet0/0/1
 description Local LAN Segment
 ip address 192.168.1.1 255.255.255.0
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 passive-interface GigabitEthernet0/0/1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.3 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
end
