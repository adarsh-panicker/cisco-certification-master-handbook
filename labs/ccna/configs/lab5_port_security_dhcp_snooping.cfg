! Lab 5: Switch Port Security & DHCP Snooping Layer 2 Defense
! Cisco Packet Tracer / Physical Switch Configuration
! Matches CCNA Chapter 5 (Security Fundamentals)

hostname ASW1-ACCESS
!
! 1. Global DHCP Snooping Activation
ip dhcp snooping
ip dhcp snooping vlan 10,20
no ip dhcp snooping information option
!
! 2. Uplink Port to Trusted DHCP Server / Gateway
interface GigabitEthernet0/1
 description Trunk Uplink to Core (Trusted DHCP Source)
 switchport mode trunk
 ip dhcp snooping trust
 no shutdown
!
! 3. Untrusted Access Ports with Sticky Port Security
interface range FastEthernet0/1 - 24
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 switchport port-security aging time 120
 switchport port-security aging type inactivity
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
end
