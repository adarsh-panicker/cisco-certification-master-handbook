! DSW2 Cisco IOS-XE Configuration
! Part II CCNP ENCOR Master Lab: Dual HSRP v2 Standby Gateway
hostname DSW2
!
ip routing
!
vlan 10
 name DATA_VLAN
vlan 20
 name VOICE_VLAN
!
interface Port-channel1
 description Inter-Switch Link to DSW1 (LACP)
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface GigabitEthernet2
 description LACP Member 1 to DSW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
!
interface GigabitEthernet3
 description LACP Member 2 to DSW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
!
interface Vlan10
 ip address 10.1.10.3 255.255.255.0
 standby version 2
 standby 10 ip 10.1.10.1
 standby 10 priority 100
 standby 10 preempt
 no shutdown
!
interface Vlan20
 ip address 10.1.20.3 255.255.255.0
 standby version 2
 standby 20 ip 10.1.20.1
 standby 20 priority 110
 standby 20 preempt
 no shutdown
!
interface GigabitEthernet1
 description Uplink to Core Router
 ip address 10.1.1.5 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 network 10.1.1.4 0.0.0.3 area 0
 network 10.1.20.0 0.0.0.255 area 20
 passive-interface Vlan10
 passive-interface Vlan20
!
end
