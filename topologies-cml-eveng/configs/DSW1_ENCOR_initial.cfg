! DSW1 Cisco IOS-XE Configuration
! Part II CCNP ENCOR Master Lab: Dual HSRP v2 with Object Tracking & LACP Port-Channel
hostname DSW1
!
ip routing
!
vlan 10
 name DATA_VLAN
vlan 20
 name VOICE_VLAN
!
interface Port-channel1
 description Inter-Switch Link to DSW2 (LACP)
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface GigabitEthernet2
 description LACP Member 1 to DSW2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
!
interface GigabitEthernet3
 description LACP Member 2 to DSW2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
!
! IP SLA 1: Ping WAN Gateway
ip sla 1
 icmp-echo 198.51.100.1 source-interface GigabitEthernet1
 frequency 5
ip sla schedule 1 life forever start-time now
!
! Track Object 1 linked to IP SLA state
track 1 ip sla 1 reachability
!
interface Vlan10
 ip address 10.1.10.2 255.255.255.0
 standby version 2
 standby 10 ip 10.1.10.1
 standby 10 priority 110
 standby 10 preempt
 standby 10 track 1 decrement 20
 no shutdown
!
interface Vlan20
 ip address 10.1.20.2 255.255.255.0
 standby version 2
 standby 20 ip 10.1.20.1
 standby 20 priority 105
 standby 20 preempt
 no shutdown
!
interface GigabitEthernet1
 description Uplink to Core Router
 ip address 10.1.1.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 10.1.1.0 0.0.0.3 area 0
 network 10.1.10.0 0.0.0.255 area 10
 passive-interface Vlan10
 passive-interface Vlan20
!
end
