! R3 Cisco IOS-XE Configuration
! Part III CCNP ENARSI Master Lab: Policy-Based Routing (PBR) Edge Router
hostname R3-PBR-EDGE
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
interface GigabitEthernet1
 description EIGRP Uplink to R1 Gateway
 ip address 10.1.13.3 255.255.255.0
 no shutdown
!
interface GigabitEthernet2
 description Alternate Uplink to R2 Core
 ip address 10.1.23.3 255.255.255.0
 no shutdown
!
interface GigabitEthernet3
 description Local LAN (Subject to Policy-Based Routing)
 ip address 192.168.100.1 255.255.255.0
 ip policy route-map POLICY_ROUTE_TRAFFIC
 no shutdown
!
ip access-list extended HIGH_PRIORITY_VOICE
 permit udp 192.168.100.0 0.0.0.255 any range 16384 32767
 permit tcp 192.168.100.0 0.0.0.255 any eq 22
!
route-map POLICY_ROUTE_TRAFFIC permit 10
 match ip address HIGH_PRIORITY_VOICE
 set ip next-hop 10.1.23.2
!
route-map POLICY_ROUTE_TRAFFIC permit 20
 ! Default routing table takes precedence for remaining traffic
!
router eigrp CAMPUS
 address-family ipv4 autonomous-system 100
  network 3.3.3.3 0.0.0.0
  network 10.1.13.0 0.0.0.255
  network 192.168.100.0 0.0.0.255
  topology base
  exit-af-topology
 exit-address-family
!
end
