! R1 Cisco IOS-XE Configuration
! Part III CCNP ENARSI Master Lab: Mutual Redistribution with Route Tagging & Prefix Filtering
hostname R1-REDIST-GATEWAY
!
interface GigabitEthernet1
 description OSPF Area 0 Link to R2
 ip address 10.1.12.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet2
 description EIGRP AS 100 Link to R3
 ip address 10.1.13.1 255.255.255.0
 no shutdown
!
! Prefix-List to Suppress Specific Host /32 Routes
ip prefix-list BLOCK_HOST_ROUTES seq 5 deny 0.0.0.0/0 ge 32
ip prefix-list BLOCK_HOST_ROUTES seq 10 permit 0.0.0.0/0 le 30
!
! Route Maps for Tagging and Mutual Redistribution Loop Prevention
route-map OSPF_TO_EIGRP deny 10
 match tag 200
!
route-map OSPF_TO_EIGRP permit 20
 match ip address prefix-list BLOCK_HOST_ROUTES
 set tag 100
!
route-map EIGRP_TO_OSPF deny 10
 match tag 100
!
route-map EIGRP_TO_OSPF permit 20
 set tag 200
 set metric-type type-1
!
router ospf 1
 router-id 1.1.1.1
 network 10.1.12.0 0.0.0.255 area 0
 redistribute eigrp 100 subnets route-map EIGRP_TO_OSPF
!
router eigrp CAMPUS
 address-family ipv4 autonomous-system 100
  network 10.1.13.0 0.0.0.255
  topology base
   redistribute ospf 1 metric 100000 100 255 1 1500 route-map OSPF_TO_EIGRP
  exit-af-topology
 exit-address-family
!
end
